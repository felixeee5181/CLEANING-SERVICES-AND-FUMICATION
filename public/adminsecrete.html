<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SparkleClean · Admin</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    body { background: #f8fafc; }
    .admin-wrap { max-width: 1000px; margin: 0 auto; padding: 30px 20px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab {
      padding: 10px 16px; border-radius: 10px; cursor: pointer;
      background: #fff; border: 1px solid var(--border); font-weight: 600;
    }
    .tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .pane { display: none; }
    .pane.active { display: block; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
    th { background: var(--alt); }
    .badge { padding: 3px 9px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .badge.pending { background: #fef3c7; color: #92400e; }
    .badge.awaiting_confirmation { background: #dbeafe; color: #1e40af; }
    .badge.confirmed { background: #dcfce7; color: #166534; }
    .badge.cancelled { background: #fee2e2; color: #991b1b; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .row input[type=text], .row textarea { padding: 8px; border: 1px solid var(--border); border-radius: 8px; }
  </style>
</head>
<body>

<div class="admin-wrap">
  <h1>Admin · <span class="muted small">adminsecrete</span></h1>
  <p id="loginStatus" class="status"></p>

  <!-- Login -->
  <div id="loginPane" class="pane active">
    <div class="form" style="max-width:400px;margin:0;">
      <label>Username <input type="text" id="adminUser" /></label>
      <label>Password <input type="password" id="adminPass" type="password" /></label>
      <button class="btn" id="loginBtn">Sign in</button>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashPane" class="pane">
    <div class="tabs">
      <div class="tab active" data-pane="paneBookings">Bookings</div>
      <div class="tab" data-pane="panePayments">Payment Methods</div>
      <div class="tab" data-pane="panePortfolio">Portfolio</div>
      <div class="tab" data-pane="paneUpload">Upload</div>
    </div>

    <div id="paneBookings" class="pane active">
      <h2>Bookings</h2>
      <div style="overflow-x:auto;"><table>
        <thead><tr>
          <th>#</th><th>Customer</th><th>Service</th><th>When</th>
          <th>Amount</th><th>Method</th><th>Ref</th><th>Status</th><th>Actions</th>
        </tr></thead>
        <tbody id="bookingsBody"></tbody>
      </table></div>
    </div>

    <div id="panePayments" class="pane">
      <h2>Payment Methods</h2>
      <p class="muted">Toggle which methods are visible on the public booking form. Fill in the account number/instructions shown to clients.</p>
      <div id="methodsBody" class="form" style="max-width:100%;"></div>
    </div>

    <div id="panePortfolio" class="pane">
      <h2>Portfolio</h2>
      <div id="portfolioAdmin" class="grid"></div>
    </div>

    <div id="paneUpload" class="pane">
      <h2>Upload portfolio item</h2>
      <form id="uploadForm" class="form" enctype="multipart/form-data">
        <label>Title <input type="text" name="title" required /></label>
        <label>Description <textarea name="description" rows="3"></textarea></label>
        <label>Category <input type="text" name="category" placeholder="e.g. couch, carpet" /></label>
        <label>Image <input type="file" name="image" accept="image/*" required /></label>
        <button type="submit" class="btn">Upload</button>
        <p id="uploadStatus" class="status"></p>
      </form>
    </div>
  </div>
</div>

<script src="/adminsecrete.js"></script>
</body>
</html>
